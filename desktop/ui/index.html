<!doctype html>
<html lang="en" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Social Hub</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <!-- Background behind the three sites: jungle by day, starry sea at night. -->
  <div class="backdrop" aria-hidden="true"></div>

  <header class="toolbar">
    <div class="brand"><span class="brand-dot"></span>Social Hub</div>

    <nav class="tabs" aria-label="Choose a view">
      <button class="tab" data-mode="all" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="16" rx="1.5"/></svg>
        All 3
      </button>
      <button class="tab" data-mode="tiktok" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-tiktok"/></svg>TikTok</button>
      <button class="tab" data-mode="instagram" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-instagram"/></svg>Instagram</button>
      <button class="tab" data-mode="x" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-x"/></svg>X</button>
    </nav>

    <button class="icon-btn" id="theme" type="button" title="Switch day / night">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- One header strip per site; the site itself is drawn by the app just below it. -->
  <main id="panes"></main>

  <template id="pane-template">
    <section class="pane">
      <div class="pane-head">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use/></svg>
        <strong class="pane-name"></strong>
        <span class="spinner" aria-label="Loading"></span>
        <span class="pane-tools">
          <button type="button" data-action="back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" data-action="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" data-action="home" title="Home feed"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
          <button type="button" data-action="zoom-out" title="Smaller"><svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
          <button type="button" data-action="zoom-in" title="Bigger"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
          <button type="button" data-action="mute" class="mute" title="Sound on / off">
            <svg class="sound-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="sound-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </span>
      </div>
      <div class="pane-body"><span class="pane-loading"></span></div>
    </section>
  </template>

  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <symbol id="icon-tiktok" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
    </symbol>
    <symbol id="icon-instagram" viewBox="0 0 24 24">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="17.6" cy="6.4" r="1.3" fill="currentColor"/>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </symbol>
  </svg>

  <script src="ui.js"></script>
</body>
</html>
