<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grab</title>
<style>
  /* One centered column: paste box on top, result card below. */
  :root {
    --bg: #f4f6f3; --panel: #ffffff; --fg: #18201b; --muted: #5d6a61; --line: #dde3dc;
    --accent: #1f8a5b; --accent-fg: #ffffff; --bad: #c2412d;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111613; --panel: #1a211d; --fg: #e8eee9; --muted: #98a59c; --line: #2b352f;
            --accent: #3fbf86; --accent-fg: #0c1a12; --bad: #ff8a73; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font);
         padding: 40px max(16px, env(safe-area-inset-left)) 40px max(16px, env(safe-area-inset-right)); }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 34px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { margin: 4px 0 0; color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 260px; min-width: 0; font: inherit; padding: 13px 14px; border-radius: 10px;
          border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: 600 15px var(--font); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: wait; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
          display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 16px; }
  @media (max-width: 520px) { .card { grid-template-columns: minmax(0, 1fr); } }
  .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: var(--line); }
  .title { font-weight: 700; margin: 0; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 14px; margin: 2px 0 12px; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .status { min-height: 1.5em; color: var(--muted); }
  .status.err { color: var(--bad); }
  .sites { color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>Grab</span> video downloader</h1>
    <p class="sub">Paste a link, pick a quality, download. Runs on your computer. No ads.</p>
  </header>

  <form id="form">
    <input id="url" type="url" placeholder="https://…" autocomplete="off" required aria-label="Video link">
    <button type="button" id="paste">Paste</button>
    <button class="primary" id="go">Get video</button>
  </form>

  <p class="status" id="status" role="status"></p>

  <section class="card" id="card" hidden>
    <img class="thumb" id="thumb" alt="">
    <div>
      <p class="title" id="title"></p>
      <p class="meta" id="meta"></p>
      <div class="options" id="options"></div>
    </div>
  </section>

  <p class="sites">Works with YouTube, TikTok, Instagram, X (Twitter), Facebook, Reddit, Vimeo, Twitch clips and
    <a href="https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md" target="_blank" rel="noopener">1,000+ more</a>.
    Download only what you have the right to keep.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const LABELS = { best: "Best quality", "1080": "1080p", "720": "720p", "480": "480p", audio: "Audio only" };
let current = "";

function status(text, isError) {
  $("status").textContent = text;
  $("status").className = "status" + (isError ? " err" : "");
}
function fmtTime(s) {
  if (!s) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

$("paste").addEventListener("click", async () => {
  try { $("url").value = (await navigator.clipboard.readText()).trim(); $("url").focus(); }
  catch { status("Your browser blocked pasting. Press Ctrl+V (or long-press) in the box instead.", true); }
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const url = $("url").value.trim();
  $("go").disabled = true; $("card").hidden = true;
  status("Reading the link…");
  try {
    const r = await fetch("/api/info", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Couldn't read that link.");
    current = url;
    $("thumb").src = d.thumbnail || ""; $("thumb").hidden = !d.thumbnail;
    $("title").textContent = d.title;
    $("meta").textContent = [d.site, d.uploader, fmtTime(d.duration), d.best_height ? d.best_height + "p" : ""]
      .filter(Boolean).join(" · ");
    $("options").replaceChildren(...d.presets.map(p => {
      const b = document.createElement("button");
      b.textContent = p === "audio" ? (d.mp3 ? "Audio (MP3)" : "Audio only") : LABELS[p];
      if (p === "best") b.className = "primary";
      b.addEventListener("click", () => download(p, b));
      return b;
    }));
    $("card").hidden = false;
    status("");
  } catch (err) {
    status(err.message, true);
  } finally {
    $("go").disabled = false;
  }
});

async function download(preset, btn) {
  const buttons = [...$("options").querySelectorAll("button")];
  buttons.forEach(b => b.disabled = true);
  const label = btn.textContent;
  btn.textContent = "Preparing…";
  status("Downloading on your computer. Bigger videos take longer, so keep this tab open.");
  try {
    const r = await fetch(`/api/download?url=${encodeURIComponent(current)}&preset=${preset}`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Download failed.");
    const name = decodeURIComponent((r.headers.get("Content-Disposition") || "")
      .match(/filename\*?=(?:UTF-8'')?"?([^";]+)/i)?.[1] || "video.mp4");
    const blob = await r.blob();
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    status(`Saved "${name}" to your Downloads folder.`);
  } catch (err) {
    status(err.message, true);
  } finally {
    btn.textContent = label;
    buttons.forEach(b => b.disabled = false);
  }
}
</script>
</body>
</html>
