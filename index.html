<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Hub</title>
  <meta name="description" content="Watch your TikTok, Instagram and X accounts side by side.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Social Hub</span>
    </div>

    <nav class="tabs" role="tablist" aria-label="Choose a view">
      <a class="tab" href="#all" data-view="all" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="16" rx="1.5"/></svg>
        <span>All</span>
      </a>
      <a class="tab" href="#tiktok" data-view="tiktok" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-tiktok"/></svg>
        <span>TikTok</span>
      </a>
      <a class="tab" href="#instagram" data-view="instagram" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-instagram"/></svg>
        <span>Instagram</span>
      </a>
      <a class="tab" href="#x" data-view="x" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-x"/></svg>
        <span>X</span>
      </a>
    </nav>

    <div class="actions">
      <button class="btn ghost" id="open-all" type="button" title="Open all three accounts in new tabs">Open all ↗</button>
      <button class="btn" id="open-settings" type="button">Accounts</button>
    </div>
  </header>

  <main class="board" id="board" data-view="all">
    <section class="panel" data-platform="tiktok">
      <header class="panel-head">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-tiktok"/></svg>
        <div class="who">
          <strong>TikTok</strong>
          <span class="handle" data-handle></span>
        </div>
        <a class="btn small" data-open target="_blank" rel="noopener">Open ↗</a>
      </header>
      <div class="panel-body" data-body></div>
    </section>

    <section class="panel" data-platform="instagram">
      <header class="panel-head">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-instagram"/></svg>
        <div class="who">
          <strong>Instagram</strong>
          <span class="handle" data-handle></span>
        </div>
        <a class="btn small" data-open target="_blank" rel="noopener">Open ↗</a>
      </header>
      <div class="panel-body" data-body></div>
    </section>

    <section class="panel" data-platform="x">
      <header class="panel-head">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-x"/></svg>
        <div class="who">
          <strong>X</strong>
          <span class="handle" data-handle></span>
        </div>
        <a class="btn small" data-open target="_blank" rel="noopener">Open ↗</a>
      </header>
      <div class="panel-body" data-body></div>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Your accounts</h2>
      <p class="hint">Type your usernames (with or without @). They're saved in this browser only.</p>

      <label>
        <span>TikTok</span>
        <input name="tiktok" placeholder="@yourname" autocomplete="off" spellcheck="false">
      </label>
      <label>
        <span>Instagram</span>
        <input name="instagram" placeholder="@yourname" autocomplete="off" spellcheck="false">
      </label>
      <label>
        <span>X</span>
        <input name="x" placeholder="@yourname" autocomplete="off" spellcheck="false">
      </label>

      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Brand icons, referenced with <use href="#icon-..."> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-tiktok" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
    </symbol>
    <symbol id="icon-instagram" viewBox="0 0 24 24">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="17.6" cy="6.4" r="1.3" fill="currentColor"/>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </symbol>
  </svg>

  <script src="app.js"></script>
</body>
</html>
